<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="880" height="470" fill="#0f1117"/>
  <text x="440" y="38" fill="#e8c66b" font-size="22" font-weight="700" text-anchor="middle">Aegis — Tamper-Evident Audit Log</text>
  <text x="440" y="60" fill="#8a93a6" font-size="13" text-anchor="middle">hash chain · Merkle checkpoints · Ed25519 signatures · streaming detection</text>

  <!-- clients -->
  <rect x="30" y="110" width="150" height="70" rx="10" fill="#1a1f2b" stroke="#2f3647"/>
  <text x="105" y="142" fill="#dfe4ee" font-size="14" text-anchor="middle" font-weight="600">HTTP clients</text>
  <text x="105" y="162" fill="#8a93a6" font-size="11" text-anchor="middle">POST /v1/events</text>

  <!-- aegisd box -->
  <rect x="240" y="90" width="400" height="300" rx="12" fill="#141925" stroke="#e8c66b" stroke-opacity="0.4"/>
  <text x="440" y="112" fill="#e8c66b" font-size="13" text-anchor="middle" font-weight="700">aegisd</text>

  <rect x="270" y="130" width="150" height="60" rx="8" fill="#1a1f2b" stroke="#2f3647"/>
  <text x="345" y="158" fill="#dfe4ee" font-size="13" text-anchor="middle">API handler</text>
  <text x="345" y="176" fill="#8a93a6" font-size="10" text-anchor="middle">validate · seal</text>

  <rect x="460" y="130" width="150" height="60" rx="8" fill="#1a1f2b" stroke="#2f3647"/>
  <text x="535" y="153" fill="#dfe4ee" font-size="13" text-anchor="middle">Store</text>
  <text x="535" y="170" fill="#8a93a6" font-size="10" text-anchor="middle">chain head · segments</text>
  <text x="535" y="183" fill="#8a93a6" font-size="10" text-anchor="middle">Merkle leaves</text>

  <rect x="270" y="220" width="150" height="60" rx="8" fill="#1a1f2b" stroke="#2f3647"/>
  <text x="345" y="248" fill="#dfe4ee" font-size="13" text-anchor="middle">Detect engine</text>
  <text x="345" y="266" fill="#8a93a6" font-size="10" text-anchor="middle">match · threshold</text>

  <rect x="460" y="220" width="150" height="60" rx="8" fill="#1a1f2b" stroke="#2f3647"/>
  <text x="535" y="243" fill="#dfe4ee" font-size="13" text-anchor="middle">Checkpoint</text>
  <text x="535" y="260" fill="#8a93a6" font-size="10" text-anchor="middle">Ed25519 signed</text>
  <text x="535" y="273" fill="#8a93a6" font-size="10" text-anchor="middle">Merkle root</text>

  <text x="440" y="330" fill="#8a93a6" font-size="11" text-anchor="middle">findings are appended back as audit events</text>
  <path d="M345 280 L345 310 L535 310 L535 282" fill="none" stroke="#5a6478" stroke-dasharray="4 3"/>

  <!-- disk -->
  <rect x="700" y="130" width="150" height="80" rx="10" fill="#1a1f2b" stroke="#2f3647"/>
  <text x="775" y="158" fill="#dfe4ee" font-size="13" text-anchor="middle" font-weight="600">data/</text>
  <text x="775" y="177" fill="#8a93a6" font-size="10" text-anchor="middle">segments · keys</text>
  <text x="775" y="191" fill="#8a93a6" font-size="10" text-anchor="middle">checkpoints.json</text>

  <!-- verifier -->
  <rect x="700" y="270" width="150" height="100" rx="10" fill="#16201b" stroke="#5fae7e"/>
  <text x="775" y="298" fill="#7fd3a1" font-size="13" text-anchor="middle" font-weight="700">aegis-verify</text>
  <text x="775" y="318" fill="#8a93a6" font-size="10" text-anchor="middle">independent replay</text>
  <text x="775" y="332" fill="#8a93a6" font-size="10" text-anchor="middle">recompute chain</text>
  <text x="775" y="346" fill="#8a93a6" font-size="10" text-anchor="middle">+ Merkle root</text>
  <text x="775" y="360" fill="#8a93a6" font-size="10" text-anchor="middle">check signature</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#5a6478"/>
    </marker>
  </defs>
  <path d="M180 145 L238 150" fill="none" stroke="#5a6478" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M420 160 L458 160" fill="none" stroke="#5a6478" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M345 190 L345 218" fill="none" stroke="#5a6478" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M610 160 L698 165" fill="none" stroke="#5a6478" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M775 210 L775 268" fill="none" stroke="#5fae7e" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="440" y="430" fill="#5a6478" font-size="11" text-anchor="middle">Trust in the entire history reduces to one Ed25519 public key.</text>
  <text x="440" y="450" fill="#5a6478" font-size="11" text-anchor="middle">The verifier shares no state with the server.</text>
</svg>
